<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Panel — AM Verifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- fflate for client-side ZIP -->
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<style>
:root{
  --bg:#f0edf8;--surface:#fff;--s2:#f5f3fd;--border:#e4ddf7;
  --accent:#7c3aed;--a2:#a855f7;--glow:rgba(124,58,237,.15);
  --text:#1a1033;--muted:#6b5f8a;--dim:#c5c0e0;
  --ok:#16a34a;--err:#dc2626;--warn:#d97706;
  --sh:0 4px 20px rgba(100,60,200,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(160deg,#e8e0f5,#f0ebfd) fixed;color:var(--text);min-height:100vh}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100}
.t-left{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--a2));
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.brand-name{font-size:14px;font-weight:700}
.brand-tag{font-size:10px;font-weight:700;color:var(--accent);background:rgba(124,58,237,.1);
  border:1px solid rgba(124,58,237,.2);border-radius:100px;padding:2px 8px}
.logout-btn{font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);
  background:transparent;border:1.5px solid var(--border);border-radius:7px;padding:5px 11px;cursor:pointer}
.logout-btn:hover{border-color:var(--err);color:var(--err)}

.wrap{max-width:960px;margin:0 auto;padding:22px 16px 48px}

/* section */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:20px 18px;margin-bottom:18px;box-shadow:var(--sh)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;box-shadow:var(--sh)}
.stat-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:3px}
.stat-val{font-size:20px;font-weight:800}
.c-purple{color:var(--accent)}.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-err{color:var(--err)}

/* form */
label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:5px}
input[type=number],input[type=text],input[type=password],select{
  width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;font-family:inherit;font-size:13px;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.field{margin-bottom:12px}
.row{display:flex;gap:8px}.row .field{flex:1}

/* buttons */
.btn{padding:10px 16px;border:none;border-radius:8px;font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--a2));color:#fff;box-shadow:0 3px 12px rgba(124,58,237,.28)}
.btn-primary:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn-success:hover:not(:disabled){opacity:.9}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);font-size:12px}
.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;color:var(--err);border:1.5px solid rgba(220,38,38,.25);font-size:11.5px;padding:5px 10px}
.btn-danger:hover:not(:disabled){background:rgba(220,38,38,.06)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .spin{display:inline-block}.loading .btn-text{display:none}

/* batch banner */
.batch-banner{display:none;background:rgba(22,163,74,.07);border:1.5px solid rgba(22,163,74,.25);
  border-radius:9px;padding:12px 15px;margin-top:12px;gap:10px;align-items:center;flex-wrap:wrap}
.batch-banner.show{display:flex}
.batch-info{flex:1;font-size:12.5px;color:var(--ok)}

/* toast */
.toast{padding:10px 13px;border-radius:8px;font-size:12.5px;display:none;gap:7px;
  align-items:flex-start;border:1.5px solid transparent;margin-top:10px}
.toast.show{display:flex}
.toast.success{background:rgba(22,163,74,.07);border-color:rgba(22,163,74,.25);color:var(--ok)}
.toast.error  {background:rgba(220,38,38,.07);border-color:rgba(220,38,38,.25);color:var(--err)}
.toast.info   {background:rgba(124,58,237,.07);border-color:rgba(124,58,237,.25);color:var(--accent)}

/* filters */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{padding:5px 13px;border-radius:100px;border:1.5px solid var(--border);background:transparent;
  font-family:inherit;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-w{flex:1;min-width:140px;position:relative}
.search-w input{padding-left:30px;margin:0}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;
  padding:7px 9px;border-bottom:1.5px solid var(--border);text-align:left;white-space:nowrap}
tbody tr:hover{background:var(--s2)}
tbody td{padding:8px 9px;border-bottom:1px solid rgba(228,221,247,.5);vertical-align:middle}
.code-cell{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px}
.b-available{background:rgba(22,163,74,.1);color:var(--ok)}
.b-used     {background:rgba(124,58,237,.1);color:var(--accent)}
.b-expired  {background:rgba(217,119,6,.1);color:var(--warn)}
.b-revoked  {background:rgba(220,38,38,.1);color:var(--err)}
.dt{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap}
.empty td{text-align:center;padding:28px;color:var(--dim);font-size:12.5px}

/* pagination */
.pg{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px}
.pg-info{font-size:11.5px;color:var(--muted)}
.pg-btns{display:flex;gap:5px}

/* login */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#e8e0f5,#f0ebfd)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:30px 26px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(100,60,200,.14);text-align:center}
.login-icon{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--a2));
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin:0 auto 14px}
.login-card h2{font-size:19px;font-weight:800;margin-bottom:3px}
.login-card p{font-size:12.5px;color:var(--muted);margin-bottom:20px}
.lf{text-align:left;margin-bottom:12px}

@media(max-width:580px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">✦</div>
    <h2>Admin Panel</h2>
    <p>AM Premium Activator</p>
    <div class="lf">
      <label>PASSWORD ADMIN</label>
      <input type="password" id="login-pass" placeholder="Masukkan password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%" onclick="doLogin()">
      <div class="spin" id="login-sp"></div>
      <span class="btn-text">Masuk →</span>
    </button>
    <div class="toast" id="login-toast" style="margin-top:10px"><span></span><span></span></div>
  </div>
</div>

<!-- PANEL -->
<div id="admin-panel" style="display:none">
  <div class="topbar">
    <div class="t-left">
      <div class="brand-icon">✦</div>
      <span class="brand-name">AM Verifier</span>
      <span class="brand-tag">ADMIN</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">Keluar</button>
  </div>

  <div class="wrap">

    <!-- STATS -->
    <div class="stats" id="stats-row">
      <div class="stat"><div class="stat-label">TOTAL KODE</div><div class="stat-val c-purple" id="s-total">0</div></div>
      <div class="stat"><div class="stat-label">TERSEDIA</div><div class="stat-val c-ok" id="s-avail">0</div></div>
      <div class="stat"><div class="stat-label">TERPAKAI</div><div class="stat-val" id="s-used">0</div></div>
      <div class="stat"><div class="stat-label">EXP/REVOKED</div><div class="stat-val c-warn" id="s-dead">0</div></div>
    </div>

    <!-- GENERATE -->
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title">🔑 Generate Kode Aktivasi</div>
      </div>
      <div class="row">
        <div class="field">
          <label>JUMLAH KODE (1–500)</label>
          <input type="number" id="gen-count" value="10" min="1" max="500"
            onkeydown="if(event.key==='Enter')doGenerate()">
        </div>
        <div style="display:flex;align-items:flex-end;padding-bottom:12px">
          <button class="btn btn-primary" id="gen-btn" onclick="doGenerate()">
            <div class="spin" id="gen-sp"></div>
            <span class="btn-text">⚡ Generate</span>
          </button>
        </div>
      </div>

      <div class="batch-banner" id="batch-banner">
        <span style="font-size:20px">✅</span>
        <div class="batch-info">
          <b id="batch-count">0</b> kode berhasil dibuat
        </div>
        <button class="btn btn-success" id="dl-btn" onclick="doDownload()">
          <div class="spin" id="dl-sp"></div>
          <span class="btn-text">⬇ Download ZIP</span>
        </button>
      </div>
      <div class="toast" id="gen-toast"><span></span><span></span></div>
    </div>

    <!-- CODE LIST -->
    <div class="sec">
      <div class="sec-head">
        <div class="sec-title">📋 Daftar Kode Aktivasi</div>
        <button class="btn btn-ghost" style="padding:6px 11px;font-size:11.5px" onclick="renderTable()">↻ Refresh</button>
      </div>

      <div class="filters">
        <button class="fbtn active" onclick="setFilter(this,'all')">Semua</button>
        <button class="fbtn" onclick="setFilter(this,'available')">Tersedia</button>
        <button class="fbtn" onclick="setFilter(this,'used')">Terpakai</button>
        <button class="fbtn" onclick="setFilter(this,'expired')">Kadaluarsa</button>
        <button class="fbtn" onclick="setFilter(this,'revoked')">Dicabut</button>
        <div class="search-w">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Cari kode atau email..." id="search-input" oninput="debSearch()">
        </div>
      </div>

      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>KODE</th><th>STATUS</th><th>DIBUAT</th>
              <th>AKTIVASI</th><th>KADALUARSA</th><th>DIPAKAI OLEH</th><th>AKSI</th>
            </tr>
          </thead>
          <tbody id="codes-tbody">
            <tr class="empty"><td colspan="8">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pg">
        <span class="pg-info" id="pg-info">—</span>
        <div class="pg-btns">
          <button class="btn btn-ghost" style="padding:6px 11px;font-size:11.5px"
            id="prev-btn" onclick="changePage(-1)" disabled>← Prev</button>
          <button class="btn btn-ghost" style="padding:6px 11px;font-size:11.5px"
            id="next-btn" onclick="changePage(1)"  disabled>Next →</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { generateCodes, listCodes, revokeCode, getStats, getCodesByBatch, buildAndDownloadZip } from './codes.js';

/* ── CONFIG ── */
const ADMIN_PASS = 'hafidsacoder1';
const PER_PAGE   = 50;

/* ── STATE ── */
let curFilter  = 'all';
let curSearch  = '';
let curPage    = 1;
let lastBatch  = [];
let searchTimer= null;

/* ── INIT ── */
if (sessionStorage.getItem('am_admin') === '1') showPanel();

window.doLogin = () => {
  const pass = document.getElementById('login-pass').value;
  if (pass === ADMIN_PASS) {
    sessionStorage.setItem('am_admin','1');
    showPanel();
  } else {
    const el = document.getElementById('login-toast');
    el.className = 'toast error show';
    el.innerHTML = '<span>❌</span><span>Password salah</span>';
  }
};

window.doLogout = () => {
  sessionStorage.removeItem('am_admin');
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('login-screen').style.display= 'flex';
  document.getElementById('login-pass').value = '';
};

function showPanel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display  = 'block';
  renderStats();
  renderTable();
}

/* ── GENERATE ── */
window.doGenerate = () => {
  const count = parseInt(document.getElementById('gen-count').value, 10);
  if (!Number.isFinite(count) || count < 1 || count > 500) {
    return showToast('gen-toast','error','Jumlah harus antara 1–500');
  }
  setLoad('gen-btn','gen-sp',true);

  // Small timeout so spinner renders
  setTimeout(() => {
    const { batch, batchId } = generateCodes(count);
    lastBatch = batch;

    document.getElementById('batch-count').textContent = batch.length;
    document.getElementById('batch-banner').classList.add('show');
    showToast('gen-toast','success',`${batch.length} kode berhasil dibuat`);
    renderStats();
    renderTable();
    setLoad('gen-btn','gen-sp',false);
  }, 50);
};

/* ── DOWNLOAD ZIP ── */
window.doDownload = async () => {
  if (!lastBatch.length) return;
  setLoad('dl-btn','dl-sp',true);
  try {
    await buildAndDownloadZip(lastBatch, `kode-aktivasi-${Date.now()}.zip`);
  } catch(e) {
    showToast('gen-toast','error','ZIP gagal: ' + e.message);
  } finally {
    setLoad('dl-btn','dl-sp',false);
  }
};

/* ── TABLE ── */
function renderTable() {
  const all    = listCodes(curFilter, curSearch);
  const total  = all.length;
  const pages  = Math.max(1, Math.ceil(total / PER_PAGE));
  if (curPage > pages) curPage = pages;
  const slice  = all.slice((curPage-1)*PER_PAGE, curPage*PER_PAGE);

  const tbody  = document.getElementById('codes-tbody');
  if (!slice.length) {
    tbody.innerHTML = '<tr class="empty"><td colspan="8">Tidak ada kode</td></tr>';
  } else {
    tbody.innerHTML = slice.map((c, i) => {
      const n = (curPage-1)*PER_PAGE + i + 1;
      return `<tr>
        <td style="color:var(--dim);font-size:11px">${n}</td>
        <td class="code-cell">${c.code}</td>
        <td><span class="badge b-${c.status}">${statusLabel(c.status)}</span></td>
        <td class="dt">${fmt(c.created_at)}</td>
        <td class="dt">${fmt(c.activated_at)}</td>
        <td class="dt">${fmt(c.expires_at)}</td>
        <td style="font-size:11.5px;color:var(--muted)">${c.used_by||'—'}</td>
        <td>${c.status==='available'
          ? `<button class="btn btn-danger" onclick="window.doRevoke('${c.id}',this)">Cabut</button>`
          : '—'}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('pg-info').textContent   = `${total} kode · Hal ${curPage}/${pages}`;
  document.getElementById('prev-btn').disabled = curPage <= 1;
  document.getElementById('next-btn').disabled = curPage >= pages;
}

window.doRevoke = (id, btn) => {
  if (!confirm('Cabut kode ini?')) return;
  btn.disabled = true;
  if (revokeCode(id)) { renderStats(); renderTable(); }
  else { btn.disabled = false; alert('Gagal mencabut kode'); }
};

function renderStats() {
  const s = getStats();
  document.getElementById('s-total').textContent = s.total;
  document.getElementById('s-avail').textContent = s.available;
  document.getElementById('s-used').textContent  = s.used;
  document.getElementById('s-dead').textContent  = s.expired + s.revoked;
}

/* ── FILTER / SEARCH / PAGE ── */
window.setFilter = (btn, status) => {
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curFilter = status; curPage = 1; renderTable();
};
window.debSearch = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    curSearch = document.getElementById('search-input').value.trim();
    curPage = 1; renderTable();
  }, 350);
};
window.changePage = dir => {
  curPage = Math.max(1, curPage + dir); renderTable();
};
window.renderTable = renderTable;

/* ── UTILS ── */
function setLoad(bid, sid, v) {
  const b=document.getElementById(bid), s=document.getElementById(sid);
  b.disabled=v; v?b.classList.add('loading'):b.classList.remove('loading');
}
function showToast(id, type, msg) {
  const el=document.getElementById(id);
  el.className=`toast ${type} show`;
  el.innerHTML=`<span>${type==='success'?'✅':'❌'}</span><span>${msg}</span>`;
}
function statusLabel(s) {
  return {available:'● Tersedia',used:'● Terpakai',expired:'● Kadaluarsa',revoked:'● Dicabut'}[s]||s;
}
function fmt(d) {
  if (!d) return '—';
  const dt=new Date(d);
  return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'2-digit'})+
    ' '+dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
</script>
</body>
</html>
